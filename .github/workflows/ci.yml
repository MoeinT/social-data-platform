name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_DB: crawltech
          POSTGRES_USER: crawltech
          POSTGRES_PASSWORD: crawltech
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U crawltech -d crawltech"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CRAWLTECH_TEST_DATABASE_URL: postgresql+psycopg2://crawltech:crawltech@localhost:5433/crawltech
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check src dags tests
      - run: uv run ruff format --check src dags tests
      - run: uv run mypy src/crawltech
      - run: uv run pytest -q

  airflow-dag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up --build -d
      - run: docker compose exec -T airflow-scheduler airflow dags list | grep crawltech_social_image_pipeline
      - if: always()
        run: docker compose down -v

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
