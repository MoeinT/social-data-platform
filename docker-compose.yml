x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/Dockerfile
    args:
      AIRFLOW_VERSION: 2.10.5
  image: social-data-platform-airflow:2.10.5
  environment: &airflow-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    AIRFLOW__WEBSERVER__SECRET_KEY: local-only-change-before-sharing
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
    _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-localdev}
    CRAWLTECH_DATABASE_URL: postgresql+psycopg2://crawltech:crawltech@app-db:5432/crawltech
    CRAWLTECH_IMAGE_STORAGE_PATH: /opt/airflow/data/images
    CRAWLTECH_CRAWL_BATCH_SIZE: ${CRAWLTECH_CRAWL_BATCH_SIZE:-5}
    CRAWLTECH_LOG_LEVEL: ${CRAWLTECH_LOG_LEVEL:-INFO}
    PYTHONPATH: /opt/airflow/src
  user: "${AIRFLOW_UID:-50000}:0"
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./src:/opt/airflow/src:ro
    - ./migrations:/opt/airflow/migrations:ro
    - ./alembic.ini:/opt/airflow/alembic.ini:ro
    - ./airflow-logs:/opt/airflow/logs
    - ./data/images:/opt/airflow/data/images
  depends_on:
    airflow-db:
      condition: service_healthy

services:
  app-db:
    image: postgres:16.4
    environment:
      POSTGRES_DB: crawltech
      POSTGRES_USER: crawltech
      POSTGRES_PASSWORD: crawltech
    ports:
      - "5433:5432"
    volumes:
      - app-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crawltech -d crawltech"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  airflow-db:
    image: postgres:16.4
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  app-migrate:
    <<: *airflow-common
    entrypoint: ["/bin/bash", "-c"]
    command: ["alembic upgrade head"]
    depends_on:
      app-db:
        condition: service_healthy
      airflow-permissions:
        condition: service_completed_successfully
    restart: "no"

  airflow-permissions:
    <<: *airflow-common
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs /opt/airflow/data/images
        chown -R ${AIRFLOW_UID:-50000}:0 /opt/airflow/logs /opt/airflow/data
        chmod -R g+rwX /opt/airflow/logs /opt/airflow/data
    restart: "no"

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate
        if ! airflow users list --output json | grep -q '"username": "'"$${_AIRFLOW_WWW_USER_USERNAME}"'"'; then
          airflow users create \
            --username "$${_AIRFLOW_WWW_USER_USERNAME}" \
            --password "$${_AIRFLOW_WWW_USER_PASSWORD}" \
            --firstname Local --lastname Admin \
            --role Admin --email local-admin@example.test
        fi
    depends_on:
      airflow-db:
        condition: service_healthy
      app-migrate:
        condition: service_completed_successfully
      airflow-permissions:
        condition: service_completed_successfully
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8974/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  app-postgres-data:
  airflow-postgres-data: